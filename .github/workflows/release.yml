name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Unit tests
        run: pio test -e native

      - name: Build firmware
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export PLATFORMIO_BUILD_FLAGS="-DFW_VERSION=\\\"${VERSION}\\\""
          pio run -e esp32doit-devkit-v1
          cp .pio/build/esp32doit-devkit-v1/firmware.bin firmware.bin
          grep -cF "JJY 40 kHz simulator ${VERSION}" firmware.bin

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" firmware.bin --title "$GITHUB_REF_NAME" --generate-notes
